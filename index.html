<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ECL Employee Data Collection</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Eastern Coalfields Limited</h1>

        <p>Employee Data Collection Portal</p>

    </div>


    <form action="/submit" method="POST">

        <h2>Personal Information</h2>

        <div class="form-grid">

            <div class="form-group">

                <label>Employee ID *</label>

                <input
                    type="text"
                    name="employee_id"
                    placeholder="Enter Employee ID"
                    required
                >

            </div>


            <div class="form-group">

                <label>Employee Name *</label>

                <input
                    type="text"
                    name="employee_name"
                    placeholder="Enter Employee Name"
                    required
                >

            </div


            <div class="form-group">

                <label>Date of Birth</label>

                <input
                    type="date"
                    name="dob"
                >

            </div>


            <div class="form-group">

                <label>Gender</label>

                <select name="gender">

                    <option value="">Select Gender</option>

                    <option value="Male">
                        Male
                    </option>

                    <option value="Female">
                        Female
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Mobile Number</label>

                <input
                    type="tel"
                    name="mobile"
                    placeholder="Enter Mobile Number"
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter Email"
                >

            </div>

        </div>


        <h2>Employment Information</h2>

        <div class="form-grid">

            <div class="form-group">

                <label>Department</label>

                <input
                    type="text"
                    name="department"
                    placeholder="Enter Department"
                >

            </div>


            <div class="form-group">

                <label>Designation</label>

                <input
                    type="text"
                    name="designation"
                    placeholder="Enter Designation"
                >

            </div>

            <div class="form-group">

                <label>Employee Type</label>

                <select name="employee_type">

                    <option value="">
                        Select Employee Type
                    </option>

                    <option value="Permanent">
                        Permanent
                    </option>

                    <option value="Contract">
                        Contract
                    </option>

                    <option value="Trainee">
                        Trainee
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Date of Joining</label>

                <input
                    type="date"
                    name="joining_date"
                >

            </div>

        </div>


        <h2>Address Information</h2>

        <div class="form-grid">

            <div class="form-group full">

                <label>Address</label>

                <textarea
                    name="address"
                    placeholder="Enter complete address"
                ></textarea>

            </div>


            <div class="form-group">

                <label>District</label>

                <input
                    type="text"
                    name="district"
                >

            </div>


            <div class="form-group">

                <label>State</label>

                <input
                    type="text"
                    name="state"
                    value="West Bengal"
                >

            </div>


            <div class="form-group">

                <label>PIN Code</label>

                <input
                    type="text"
                    name="pin_code"
                    placeholder="Enter PIN Code"
                >

            </div>


            <div class="form-group">

                <label>Emergency Contact</label>

                <input
                    type="tel"
                    name="emergency_contact"
                    placeholder="Emergency Contact Number"
                >

            </div>

        </div>


        <div class="submit-section">

            <button type="submit">
                Submit Employee Data
            </button>

        </div>

    </form>

</div>

</body>

</html>
