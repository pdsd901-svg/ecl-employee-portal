<!DOCTYPE html>
<html>

<head>

    <title>Employee Records</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f3f5f7;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #17365d;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #17365d;
            color: white;
        }

        tr:nth-child(even) {
            background: #f5f5f5;
        }

    </style>

</head>

<body>

<h1>ECL Employee Records</h1>

<div class="table-container">

<table>

<thead>

<tr>

    <th>ID</th>
    <th>Employee ID</th>
    <th>Name</th>
    <th>Department</th>
    <th>Designation</th>
    <th>Mobile</th>
    <th>Email</th>

</tr>

</thead>

<tbody>

{% for employee in employees %}

<tr>

    <td>{{ employee.id }}</td>

    <td>{{ employee.employee_id }}</td>

    <td>{{ employee.employee_name }}</td>

    <td>{{ employee.department }}</td>

    <td>{{ employee.designation }}</td>

    <td>{{ employee.mobile }}</td>

    <td>{{ employee.email }}</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</body>

</html>
